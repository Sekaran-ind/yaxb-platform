# The kiosk's screens. `layouts` limits a screen to some layouts (mini, pod, full); absent means all.
# `nav` picks the navigation chrome per layout: tabs, sidebar, accordion, or panes.
kind: screens
id: kiosk
defaultScreen: transcript
nav:
  mini: tabs
  pod: tabs
  full: tabs
screens:
  - { id: transcript, label: Transcript, icon: message-square, component: transcript }
  - { id: services, label: Services, icon: layout-grid, component: services }
  - { id: notebook, label: Notebook, icon: notebook, component: notebook }
  - { id: records, label: Sources, icon: library, component: records, layouts: [pod, full] }
  - { id: translate, label: Translate, icon: languages, component: translate, hidden: true }
