name: Android
# Builds the YAXB Kiosk Android app (apps/native, Capacitor) as a debug APK, downloadable from the run's
# artifacts, to install on a test phone. Built here because the native toolchain (JDK, Android SDK)
# isn't on the dev machines. Follows clinux-diary's and clinux-pro's android.yml.
#
# The app sends /api calls to the kiosk server at VITE_API_BASE (PLT-11): https://anjalai.cc unless the
# repository variable VITE_API_BASE says otherwise (Settings → Secrets and variables → Actions →
# Variables), as clinux-pro defaults to its production services.
#
# It runs after a merge to main (and by hand), not on pull requests: PRs merge once the local tests
# pass, and the Android build and check on main come before any deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://anjalai.cc' }}
      # onnxruntime-node (a dev dependency for the embedding scripts) would download its CUDA build,
      # whose release asset is gone (404); the APK never uses it.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the packages (yaxb-journeys, then yaxb-core)
        run: npm run build:core
      - name: Build the kiosk web bundle in native mode
        run: npm run build:native -w @sekaran-ind/yaxb-web
      - name: Copy it into the Android project
        working-directory: apps/native
        run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build the debug APK
        working-directory: apps/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: yaxb-kiosk-android-debug
          path: apps/native/android/app/build/outputs/apk/debug/app-debug.apk
